<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image viewer · NARIT TCS</title><link rel="icon" href="/assets/favicon.svg"><style>
:root{color-scheme:dark;font-family:Segoe UI,sans-serif;color:#edf1f8;background:#10141b}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}[hidden]{display:none!important}.button,select{background:#121b25;border:1px solid #354c61;border-radius:7px;padding:10px 14px;font-size:12px}.button:disabled{opacity:.4}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #65e5c4}.muted{color:#91a9bf;font-size:11px}.image-viewer-shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:12px;padding:16px}.image-viewer-toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.image-viewer-toolbar>div:first-child{flex:1;min-width:180px}.image-viewer-toolbar h1{font-size:20px;margin:0 0 5px}.image-viewer-toolbar p{margin:0;overflow-wrap:anywhere;font-family:Consolas,monospace}.acquisition-actions,.image-viewer-zoom{display:flex;align-items:center;gap:8px}.image-viewer-zoom span{min-width:40px;text-align:center;font-size:12px}.viewer-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-height:0}.viewer-body.header-hidden{grid-template-columns:minmax(0,1fr)}.image-viewer-viewport{min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#050b10;border:1px solid #304456;border-radius:10px}.image-viewer-viewport img{width:100%;height:100%;object-fit:contain;transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none}.image-viewer-viewport.zoomed{cursor:grab}.viewer-header-panel{min-height:0;display:flex;flex-direction:column;background:#18222e;border:1px solid #304456;border-radius:10px}.viewer-header-panel h2{font-size:14px;margin:0;padding:15px;border-bottom:1px solid #304456}.viewer-header-scroll{min-height:0;overflow:auto;padding:0 10px 10px}.viewer-header-panel table{border-collapse:collapse;width:100%;font:10px Consolas,monospace;table-layout:fixed}.viewer-header-panel th,.viewer-header-panel td{padding:9px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere;border-bottom:1px solid #ffffff0c}.viewer-header-panel th{position:sticky;top:0;background:#18222e;color:#91a9bf}.viewer-header-panel th:first-child{width:30%}.viewer-header-panel td:first-child{color:#65e5c4}.image-viewer-footer{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;padding:12px 16px;background:#101923;border:1px solid #304456;border-radius:10px}.acquisition-stretch-field{display:flex;align-items:center;gap:12px;font-size:12px}.image-stretch-sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}.image-stretch-sliders label{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:12px}.image-stretch-sliders output{color:#65e5c4;font:11px Consolas,monospace}.image-stretch-sliders input{grid-column:1/-1;width:100%;accent-color:#65e5c4;cursor:pointer}.image-viewer-message{font-size:12px;color:#65e5c4;margin:0}.viewer-header-comment{display:block;color:#91a9bf;margin-top:4px}@media(max-width:720px){.image-viewer-shell{padding:10px}.viewer-body{grid-template-columns:minmax(0,1fr) 220px}.image-viewer-toolbar{gap:8px}.image-stretch-sliders{gap:8px}}@media(max-width:520px){.viewer-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(180px,1fr) 140px}.viewer-body.header-hidden{grid-template-rows:minmax(0,1fr)}.image-viewer-footer{padding:10px;gap:8px}.image-stretch-sliders{grid-template-columns:1fr}.viewer-header-panel h2{padding:8px}}
</style></head>
<body class="image-viewer-page">
<section class="image-viewer-shell">
  <header class="image-viewer-toolbar"><div><h1>Image viewer</h1><p id="viewer-filename" class="muted"></p></div><div class="acquisition-actions"><button id="viewer-header" class="button quiet" disabled>FITS header</button><a id="viewer-download" class="button quiet" hidden>Download FITS</a></div><div class="image-viewer-zoom"><button id="viewer-zoom-out" class="button quiet" aria-label="Zoom out">−</button><span id="viewer-zoom-level">100%</span><button id="viewer-zoom-in" class="button quiet" aria-label="Zoom in">+</button><button id="viewer-fit" class="button quiet">Fit</button></div></header>
  <div class="viewer-body"><div id="viewer-viewport" class="image-viewer-viewport"><img id="viewer-image" alt="Captured image" hidden draggable="false"><span id="viewer-empty">Loading image…</span></div><aside id="viewer-header-panel" class="viewer-header-panel"><h2>FITS header</h2><div class="viewer-header-scroll"><table><thead><tr><th>Keyword</th><th>Value / comment</th></tr></thead><tbody id="viewer-header-rows"><tr><td colspan="2">Loading metadata...</td></tr></tbody></table></div></aside></div>
  <footer id="viewer-stretch-tools" class="image-viewer-footer"><label class="field acquisition-stretch-field">Stretch profile<select id="viewer-stretch" disabled><option>Auto</option></select></label><p id="viewer-details" class="muted"></p></footer>
  <p id="viewer-message" class="image-viewer-message" role="status">Loading a quick preview...</p><button id="viewer-retry" class="button" hidden onclick="location.reload()">Retry loading</button>
</section><script>setTimeout(()=>{if(!window.viewerBooted){document.getElementById("viewer-message").textContent="Loading is taking longer than expected. Check the connection and retry.";document.getElementById("viewer-retry").hidden=false;}},8000);</script><script type="module" src="/assets/image-viewer.js"></script></body></html>
